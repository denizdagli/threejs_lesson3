<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Renk ve Isik</title>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

<script src="three.min.js"></script>

<script>
  // ---- Onceki derslerden tanidik: sahne, kamera, cizici ----
  const sahne = new THREE.Scene();
  sahne.background = new THREE.Color(0x0b1d3a);

  const kamera = new THREE.PerspectiveCamera(
    75, window.innerWidth / window.innerHeight, 0.1, 1000
  );
  kamera.position.set(0, 2, 10);
  kamera.lookAt(0, 0, 0);

  const cizici = new THREE.WebGLRenderer();
  cizici.setSize(window.innerWidth, window.innerHeight);
  cizici.shadowMap.enabled = true;   // BONUS: golgeleri ac
  document.body.appendChild(cizici.domElement);

  // ---- YENI: ISIKLAR ----
  const genelIsik = new THREE.AmbientLight(0xffffff, 0.4);      // her yeri hafifce aydinlatir
  sahne.add(genelIsik);

  const gunes = new THREE.DirectionalLight(0xffffff, 0.9);      // gunes gibi, bir yonden gelir
  gunes.position.set(5, 10, 7);
  gunes.castShadow = true;                                      // BONUS: golge dusur
  gunes.shadow.camera.left = -10;
  gunes.shadow.camera.right = 10;
  gunes.shadow.camera.top = 10;
  gunes.shadow.camera.bottom = -10;
  sahne.add(gunes);

  // ---- YENI: RENKLI MALZEMELER ----
  const kirmizi = new THREE.MeshStandardMaterial({ color: 0xff595e });
  const sari    = new THREE.MeshStandardMaterial({ color: 0xffca3a });
  const yesil   = new THREE.MeshStandardMaterial({ color: 0x8ac926 });
  const mavi    = new THREE.MeshStandardMaterial({ color: 0x1982c4 });

  // ---- KARDAN ADAM (renkli, golgeli) ----
  const beyaz = new THREE.MeshStandardMaterial({ color: 0xf4f7fb });
  const turuncu = new THREE.MeshStandardMaterial({ color: 0xff8c42 });
  const siyah = new THREE.MeshStandardMaterial({ color: 0x1b1b1b });

  function parcaEkle(sekil, malzeme, x, y, z) {
    const parca = new THREE.Mesh(sekil, malzeme);
    parca.position.set(x, y, z);
    parca.castShadow = true;
    sahne.add(parca);
    return parca;
  }

  parcaEkle(new THREE.SphereGeometry(1.2, 32, 32), beyaz, 0, -0.8, 0);   // govde
  parcaEkle(new THREE.SphereGeometry(0.9, 32, 32), beyaz, 0, 1.0, 0);    // orta
  parcaEkle(new THREE.SphereGeometry(0.6, 32, 32), beyaz, 0, 2.3, 0);    // kafa
  const burun = parcaEkle(new THREE.ConeGeometry(0.15, 0.7, 16), turuncu, 0, 2.3, 0.7); // burun
  burun.rotation.x = Math.PI / 2;   // konuyu yan yatir, one baksin
  parcaEkle(new THREE.SphereGeometry(0.07, 16, 16), siyah, -0.2, 2.5, 0.52); // sol goz
  parcaEkle(new THREE.SphereGeometry(0.07, 16, 16), siyah, 0.2, 2.5, 0.52);  // sag goz

  const zeminMalzeme = new THREE.MeshStandardMaterial({ color: 0x2a3f6b });
  const zemin = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), zeminMalzeme);
  zemin.rotation.x = -Math.PI / 2;
  zemin.position.y = -2;
  zemin.receiveShadow = true;
  sahne.add(zemin);

  function ciz() {
    requestAnimationFrame(ciz);
    cizici.render(sahne, kamera);
  }
  ciz();
</script>

</body>
</html>
