<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Renk ve Isik</title>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

<script src="three.min.js"></script>

<script>
  // ---- Onceki derslerden tanidik: sahne, kamera, cizici ----
  const sahne = new THREE.Scene();
  sahne.background = new THREE.Color(0x0b1d3a);

  const kamera = new THREE.PerspectiveCamera(
    75, window.innerWidth / window.innerHeight, 0.1, 1000
  );
  kamera.position.set(0, 2, 10);
  kamera.lookAt(0, 0, 0);

  const cizici = new THREE.WebGLRenderer();
  cizici.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(cizici.domElement);

  // ---- GOREV 2: AmbientLight ekle ----
  // Ipucu: new THREE.AmbientLight(0xffffff, 0.4)  ->  sahne.add(...)

  // ---- GOREV 3: DirectionalLight ekle ----
  // Ipucu: new THREE.DirectionalLight(0xffffff, 0.9)
  //        konum: .position.set(5, 10, 7)  ->  sahne.add(...)

  // ---- Simdilik hepsi ayni malzeme (Ders 2'deki gibi) ----
  const malzeme = new THREE.MeshNormalMaterial();

  // ---- GOREV 1: Kupu boya ----
  // Ipucu: const kirmizi = new THREE.MeshStandardMaterial({ color: 0xff595e });
  //        sonra kupun icindeki `malzeme` kelimesini `kirmizi` yap.
  //        Kup SIYAH cikarsa sorun yok: isik henuz yok! Gorev 2 ve 3'u yap.

  // ---- 1) KUP ----
  const kup = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), malzeme);
  kup.position.set(-4.5, -1, 0);
  sahne.add(kup);

  // ---- 2) KURE ----
  const kure = new THREE.Mesh(new THREE.SphereGeometry(1.2, 32, 32), malzeme);
  kure.position.set(-1.5, -0.8, 0);
  sahne.add(kure);

  // ---- 3) SILINDIR ----
  const silindir = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 2.5, 32), malzeme);
  silindir.position.set(1.5, -0.75, 0);
  sahne.add(silindir);

  // ---- 4) HALKA ----
  const halka = new THREE.Mesh(new THREE.TorusGeometry(1, 0.4, 16, 48), malzeme);
  halka.position.set(4.5, -0.6, 0);
  sahne.add(halka);

  // ---- GOREV 4: Diger uc sekli de boya (sari, yesil, mavi) ----

  // ---- ZEMIN (tel kafes, simdilik) ----
  const zeminMalzeme = new THREE.MeshBasicMaterial({ color: 0x4a6cf7, wireframe: true });
  const zemin = new THREE.Mesh(new THREE.PlaneGeometry(30, 30, 30, 30), zeminMalzeme);
  zemin.rotation.x = -Math.PI / 2;
  zemin.position.y = -2;
  sahne.add(zemin);

  // ---- GOREV 5 (bonus): Golge ekle ----
  // Ipucu: tam kodda (index.html) "BONUS" yazan satirlara bak.
  //        Zemini dolu yapmak icin MeshStandardMaterial kullan.

  // ---- Animasyon ----
  function ciz() {
    requestAnimationFrame(ciz);
    kup.rotation.y += 0.01;
    kure.rotation.y += 0.01;
    silindir.rotation.y += 0.01;
    halka.rotation.y += 0.02;
    cizici.render(sahne, kamera);
  }
  ciz();
</script>

</body>
</html>
